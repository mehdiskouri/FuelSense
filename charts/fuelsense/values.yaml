global:
  namespace: fuelsense
  imageRegistry: ghcr.io/mehdiskouri/fuelsense
  imageTag: latest

compute:
  device: cpu

secrets:
  djangoSecretKey: change-me
  postgresPassword: fuelsense
  databaseUrl: postgresql://fuelsense:fuelsense@postgresql:5432/fuelsense

django:
  replicas: 2
  image: django
  servicePort: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

celery:
  default:
    replicas: 2
    concurrency: 4
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  training:
    replicas: 1
    concurrency: 2
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  planning:
    replicas: 1
    concurrency: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  beat:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi

forecaster:
  image: forecaster
  replicas: 2
  servicePort: 8001
  env:
    FUELSENSE_DEVICE: cpu
    FUELSENSE_FORECAST_BATCH_SIZE_CPU: "16"
    FUELSENSE_FORECAST_TRAINING_BATCH_SIZE_CPU: "32"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

anomaly:
  image: anomaly
  replicas: 1
  servicePort: 8002
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

optimizer:
  image: optimizer
  replicas: 1
  servicePort: 8003
  env:
    FUELSENSE_DEVICE: cpu
    FUELSENSE_OPTIMIZER_BACKEND: ortools
    FUELSENSE_OPTIMIZER_TIME_LIMIT_MS: "10000"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

postgresql:
  image: postgres:16
  storage: 10Gi
  db: fuelsense
  user: fuelsense

redis:
  image: redis:7-alpine

mlflow:
  image: ghcr.io/mlflow/mlflow:v2.11.0
  storage: 20Gi

monitoring:
  serviceMonitor:
    enabled: false
  prometheus:
    image: prom/prometheus:v2.50.0
    retention: 15d
    storage: 10Gi
  grafana:
    image: grafana/grafana:10.3.0

ingress:
  enabled: true
  className: nginx
  host: fuelsense.local

networkPolicy:
  enabled: true

serviceMesh:
  enabled: false
