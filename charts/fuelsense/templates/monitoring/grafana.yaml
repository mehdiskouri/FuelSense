apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fuelsense.fullname" . }}-grafana-dashboards
  namespace: {{ .Values.global.namespace }}
data:
  operations.json: |
    {"title":"Operations","uid":"ops-dashboard","schemaVersion":39,"version":1}
  ml-health.json: |
    {"title":"ML Health","uid":"ml-health-dashboard","schemaVersion":39,"version":1}
  logistics.json: |
    {"title":"Logistics","uid":"logistics-dashboard","schemaVersion":39,"version":1}
  system.json: |
    {"title":"System","uid":"system-dashboard","schemaVersion":39,"version":1}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fuelsense.fullname" . }}-grafana-provisioning
  namespace: {{ .Values.global.namespace }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "fuelsense.fullname" . }}-prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: FuelSense Dashboards
        orgId: 1
        folder: FuelSense
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuelsense.fullname" . }}-grafana
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      {{- include "fuelsense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        {{- include "fuelsense.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: provisioning
              mountPath: /etc/grafana/provisioning
      volumes:
        - name: dashboards
          configMap:
            name: {{ include "fuelsense.fullname" . }}-grafana-dashboards
        - name: provisioning
          configMap:
            name: {{ include "fuelsense.fullname" . }}-grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuelsense.fullname" . }}-grafana
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/component: grafana
    {{- include "fuelsense.selectorLabels" . | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
