apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fuelsense.fullname" . }}-postgresql
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: {{ include "fuelsense.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgresql
      {{- include "fuelsense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgresql
        {{- include "fuelsense.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuelsense.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgresql.user }} -d {{ .Values.postgresql.db }}"]
            initialDelaySeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuelsense.fullname" . }}-postgresql
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/component: postgresql
    {{- include "fuelsense.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
