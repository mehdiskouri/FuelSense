apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuelsense.fullname" . }}-mlflow
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mlflow
      {{- include "fuelsense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mlflow
        {{- include "fuelsense.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mlflow
          image: {{ .Values.mlflow.image }}
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - postgresql://{{ .Values.postgresql.user }}:{{ .Values.secrets.postgresPassword }}@{{ include "fuelsense.fullname" . }}-postgresql:5432/{{ .Values.postgresql.db }}
            - --artifacts-destination
            - /mlflow/mlruns
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlartifacts
              mountPath: /mlflow/mlruns
      volumes:
        - name: mlartifacts
          persistentVolumeClaim:
            claimName: {{ include "fuelsense.fullname" . }}-mlflow-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fuelsense.fullname" . }}-mlflow-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.mlflow.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuelsense.fullname" . }}-mlflow
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/component: mlflow
    {{- include "fuelsense.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5000
      targetPort: 5000
