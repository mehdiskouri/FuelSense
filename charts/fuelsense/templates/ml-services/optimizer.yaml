apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuelsense.fullname" . }}-optimizer
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.optimizer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: optimizer
      {{- include "fuelsense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: optimizer
        {{- include "fuelsense.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.optimizer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.optimizer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: optimizer
          image: {{ include "fuelsense.image" (dict "Values" .Values "image" .Values.optimizer.image) }}
          ports:
            - containerPort: {{ .Values.optimizer.servicePort }}
          envFrom:
            - configMapRef:
                name: {{ include "fuelsense.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.optimizer.servicePort }}
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.optimizer.servicePort }}
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.optimizer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuelsense.fullname" . }}-optimizer
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: optimizer
    {{- include "fuelsense.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.optimizer.servicePort }}
      targetPort: {{ .Values.optimizer.servicePort }}
