apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuelsense.fullname" . }}-celery-planning
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.celery.planning.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: celery-planning
      {{- include "fuelsense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: celery-planning
        {{- include "fuelsense.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: worker-planning
          image: {{ include "fuelsense.image" (dict "Values" .Values "image" .Values.django.image) }}
          command: ["celery", "-A", "fuelsense.celery:app", "worker", "-Q", "planning", "--loglevel=info", "-c", "{{ .Values.celery.planning.concurrency }}"]
          envFrom:
            - configMapRef:
                name: {{ include "fuelsense.fullname" . }}-config
            - secretRef:
                name: {{ include "fuelsense.fullname" . }}-secret
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A fuelsense.celery:app inspect ping -d celery@$(hostname) | grep -q pong"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.celery.planning.resources | nindent 12 }}
