apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuelsense.fullname" . }}-celery-beat
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.celery.beat.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: celery-beat
      {{- include "fuelsense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: celery-beat
        {{- include "fuelsense.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: beat
          image: {{ include "fuelsense.image" (dict "Values" .Values "image" .Values.django.image) }}
          command: ["celery", "-A", "fuelsense", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: {{ include "fuelsense.fullname" . }}-config
            - secretRef:
                name: {{ include "fuelsense.fullname" . }}-secret
          resources:
            {{- toYaml .Values.celery.beat.resources | nindent 12 }}
