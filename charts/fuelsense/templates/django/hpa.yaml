{{- if .Values.django.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fuelsense.fullname" . }}-django
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fuelsense.fullname" . }}-django
  minReplicas: {{ .Values.django.hpa.minReplicas }}
  maxReplicas: {{ .Values.django.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.django.hpa.targetCPUUtilizationPercentage }}
{{- end }}
