apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuelsense.fullname" . }}-django
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fuelsense.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.django.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: django
      {{- include "fuelsense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: django
        {{- include "fuelsense.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: django
          image: {{ include "fuelsense.image" (dict "Values" .Values "image" .Values.django.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.django.servicePort }}
          envFrom:
            - configMapRef:
                name: {{ include "fuelsense.fullname" . }}-config
            - secretRef:
                name: {{ include "fuelsense.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.django.servicePort }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.django.servicePort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.django.resources | nindent 12 }}
