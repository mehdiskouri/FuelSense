{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fuelsense.fullname" . }}-django
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fuelsense.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fuelsense.fullname" . }}-django
                port:
                  number: {{ .Values.django.servicePort }}
{{- end }}
