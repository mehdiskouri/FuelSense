apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fuelsense.fullname" . }}-smoke
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.8.0
      command:
        - sh
        - -c
        - |
          set -e
          curl -fsS http://{{ include "fuelsense.fullname" . }}-django:8000/healthz
          curl -fsS http://{{ include "fuelsense.fullname" . }}-django:8000/readyz
          curl -fsS http://{{ include "fuelsense.fullname" . }}-forecaster:8001/health
          curl -fsS http://{{ include "fuelsense.fullname" . }}-anomaly:8002/health
          curl -fsS http://{{ include "fuelsense.fullname" . }}-optimizer:8003/health
          curl -fsS http://{{ include "fuelsense.fullname" . }}-mlflow:5000/
