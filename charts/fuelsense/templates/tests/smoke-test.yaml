apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fuelsense.fullname" . }}-smoke
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: smoke-test
    {{- include "fuelsense.selectorLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.8.0
      command:
        - sh
        - -c
        - |
          set -e
          probe() {
            curl -fsS --connect-timeout 5 --max-time 15 --retry 8 --retry-delay 2 --retry-connrefused "$1"
          }

          probe http://{{ include "fuelsense.fullname" . }}-django:8000/healthz
          probe http://{{ include "fuelsense.fullname" . }}-django:8000/readyz
          probe http://{{ include "fuelsense.fullname" . }}-forecaster:8001/health
          probe http://{{ include "fuelsense.fullname" . }}-anomaly:8002/health
          probe http://{{ include "fuelsense.fullname" . }}-optimizer:8003/health
          probe http://{{ include "fuelsense.fullname" . }}-mlflow:5000/
