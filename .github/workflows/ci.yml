name: CI/CD

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint and type dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy fuelsense/ fuelsense_common/

  validate-helm:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Helm lint CPU and GPU values
        run: |
          helm lint charts/fuelsense/
          helm lint charts/fuelsense/ -f charts/fuelsense/values-gpu.yaml
      - name: Helm template + kubeconform CPU
        run: |
          helm template fuelsense charts/fuelsense/ | kubeconform -strict -summary
      - name: Helm template + kubeconform GPU
        run: |
          helm template fuelsense charts/fuelsense/ -f charts/fuelsense/values-gpu.yaml | kubeconform -strict -summary

  test-django:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fuelsense
          POSTGRES_PASSWORD: fuelsense
          POSTGRES_DB: fuelsense
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/forecaster-cpu.txt -r requirements/dev.txt
      - name: Run Django tests with coverage
        env:
          POSTGRES_DB: fuelsense
          POSTGRES_USER: fuelsense
          POSTGRES_PASSWORD: fuelsense
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          pytest fuelsense/ --cov=fuelsense --cov-fail-under=95 --cov-report=xml:django-coverage.xml
      - name: Upload Django coverage report
        uses: actions/upload-artifact@v4
        with:
          name: django-coverage
          path: django-coverage.xml

  test-ml-services:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install torch torchvision --index-url https://download.pytorch.org/whl/cu130 || pip3 install torch==2.10.0
          pip install -r requirements/base.txt -r requirements/forecaster-cpu.txt -r requirements/anomaly.txt -r requirements/optimizer-cpu.txt -r requirements/dev.txt
      - name: Run ML service tests
        run: |
          pytest -q \
            --cov=fuelsense_common \
            --cov=forecaster \
            --cov=anomaly \
            --cov=optimizer \
            --cov=ml_pipeline \
            --cov-fail-under=95 \
            --cov-report=xml:ml-coverage.xml \
            fuelsense_common/tests \
            forecaster/tests \
            anomaly/tests \
            optimizer/tests \
            ml_pipeline/tests
      - name: Upload ML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ml-coverage
          path: ml-coverage.xml

  build-images:
    if: always()
    runs-on: ubuntu-latest
    needs: [test-django, test-ml-services, validate-helm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: django
            dockerfile: Dockerfile.django
          - name: forecaster
            dockerfile: Dockerfile.forecaster
          - name: anomaly
            dockerfile: Dockerfile.anomaly
          - name: optimizer
            dockerfile: Dockerfile.optimizer
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate compose manifests
        run: |
          docker compose -f docker-compose.yml config > /tmp/compose.out
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config > /tmp/compose-gpu.out
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-results-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  deploy-staging:
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: engineerd/setup-kind@v0.6.2
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      - name: Create cluster and preload images
        run: |
          kind create cluster --config infra/kind-config.yaml --name fuelsense-ci || true
          for image in django forecaster anomaly optimizer; do
            docker pull ${{ env.IMAGE_PREFIX }}/${image}:${{ github.sha }}
            kind load docker-image ${{ env.IMAGE_PREFIX }}/${image}:${{ github.sha }} --name fuelsense-ci
          done
      - name: Deploy with Helm
        run: |
          helm upgrade --install fuelsense charts/fuelsense \
            --namespace fuelsense \
            --create-namespace \
            --set global.imageRegistry=${{ env.IMAGE_PREFIX }} \
            --set global.imageTag=${{ github.sha }} \
            --wait --timeout 300s
      - name: Run Helm smoke tests
        if: always()
        run: |
          helm test fuelsense -n fuelsense
