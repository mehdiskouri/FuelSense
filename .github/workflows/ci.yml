name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint and type dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy fuelsense/ fuelsense_common/

  validate-helm:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Helm lint CPU and GPU values
        run: |
          helm lint charts/fuelsense/
          helm lint charts/fuelsense/ -f charts/fuelsense/values-gpu.yaml
      - name: Helm template + kubeconform CPU
        run: |
          helm template fuelsense charts/fuelsense/ | kubeconform -strict -summary
      - name: Helm template + kubeconform GPU
        run: |
          helm template fuelsense charts/fuelsense/ -f charts/fuelsense/values-gpu.yaml | kubeconform -strict -summary

  test-django:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fuelsense
          POSTGRES_PASSWORD: fuelsense
          POSTGRES_DB: fuelsense
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Run Django tests with coverage
        env:
          POSTGRES_DB: fuelsense
          POSTGRES_USER: fuelsense
          POSTGRES_PASSWORD: fuelsense
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          pytest fuelsense/ --cov=fuelsense --cov-fail-under=94 --cov-report=xml

  test-ml-services:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/forecaster-cpu.txt -r requirements/anomaly.txt -r requirements/optimizer-cpu.txt -r requirements/dev.txt
      - name: Run ML service tests
        run: |
          pytest -q \
            fuelsense_common/tests \
            forecaster/tests/test_service.py \
            anomaly/tests/test_service.py \
            anomaly/tests/test_detector.py \
            optimizer/tests/test_service.py \
            optimizer/tests/test_cpu_backend.py \
            optimizer/tests/test_benchmark.py \
            forecaster/tests/test_model.py \
            forecaster/tests/test_cpu_backend.py \
            ml_pipeline/tests/test_drift.py \
            ml_pipeline/tests/test_training.py \
            ml_pipeline/tests/test_anomaly_training.py

  build-images:
    runs-on: ubuntu-latest
    needs: [test-django, test-ml-services, validate-helm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: django
            dockerfile: Dockerfile.django
          - name: forecaster
            dockerfile: Dockerfile.forecaster
          - name: anomaly
            dockerfile: Dockerfile.anomaly
          - name: optimizer
            dockerfile: Dockerfile.optimizer
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose manifests
        run: |
          docker compose -f docker-compose.yml config > /tmp/compose.out
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config > /tmp/compose-gpu.out
      - name: Build image
        run: |
          docker build -f ${{ matrix.dockerfile }} -t fuelsense/${{ matrix.name }}:${{ github.sha }} .

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - uses: engineerd/setup-kind@v0.6.2
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      - name: Deploy with Helm
        run: |
          kind create cluster --config infra/kind-config.yaml --name fuelsense-ci || true
          helm upgrade --install fuelsense charts/fuelsense \
            --namespace fuelsense \
            --create-namespace \
            --set global.imageTag=${{ github.sha }} \
            --wait --timeout 300s

  smoke-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
      - uses: engineerd/setup-kind@v0.6.2
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      - name: Run Helm smoke test
        run: |
          kind create cluster --config infra/kind-config.yaml --name fuelsense-ci || true
          helm upgrade --install fuelsense charts/fuelsense \
            --namespace fuelsense \
            --create-namespace \
            --wait --timeout 300s
          helm test fuelsense -n fuelsense
