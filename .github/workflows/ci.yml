name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint and type dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy fuelsense/ fuelsense_common/

  test-django:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fuelsense
          POSTGRES_PASSWORD: fuelsense
          POSTGRES_DB: fuelsense
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Placeholder test job
        run: echo "Django tests activate in Phase 1"

  test-ml-services:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/forecaster-cpu.txt -r requirements/anomaly.txt -r requirements/optimizer-cpu.txt -r requirements/dev.txt
      - name: Placeholder test job
        run: echo "ML service tests activate in later phases"

  build-images:
    runs-on: ubuntu-latest
    needs: [test-django, test-ml-services]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: django
            dockerfile: Dockerfile.django
          - name: forecaster
            dockerfile: Dockerfile.forecaster
          - name: anomaly
            dockerfile: Dockerfile.anomaly
          - name: optimizer
            dockerfile: Dockerfile.optimizer
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose manifests
        run: |
          docker compose -f docker-compose.yml config > /tmp/compose.out
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config > /tmp/compose-gpu.out
      - name: Build image
        run: |
          docker build -f ${{ matrix.dockerfile }} -t fuelsense/${{ matrix.name }}:${{ github.sha }} .

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - name: Placeholder deploy job
        run: echo "Staging deploy activates in deployment phases"

  smoke-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - name: Placeholder smoke test
        run: echo "Smoke tests activate once staging exists"
